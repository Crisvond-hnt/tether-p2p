interface:
  display_name: Tether P2P
  short_description: Build Pear / Hypercore / QVAC / WDK apps with no cloud backend.
  brand_color: "#1A1A1A"
  default_prompt: >-
    Use the tether-p2p skill. Follow SKILL.md in order. Run scripts/check-env.mjs,
    clone the official Pear host, run scripts/set-upgrade.mjs, implement one recipe
    in a Bare worker, then scripts/verify-app.mjs and the verify checklist.

policy:
  allow_implicit_invocation: true
